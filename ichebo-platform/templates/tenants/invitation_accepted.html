{% extends "base_auth.html" %}
{% load static %}
{% block title %}Invitation Accepted — Ichebo{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__brand">
    <img src="{% static 'images/logo.svg' %}" alt="Ichebo" class="auth-logo" style="height:56px;width:auto;">
  </div>
  <div style="text-align:center">
    <span class="material-symbols-outlined" style="font-size:2.5rem;color:var(--success)">check_circle</span>
    <h1 style="font-size:1.4rem;margin:0.5rem 0 0.25rem">You've joined {{ tenant.name }}</h1>
    <p class="auth-card__subtitle">You are now an active member of this community.</p>
  </div>
  <div class="auth-divider"></div>
  <a href="{% url 'community:community-home' %}" class="auth-btn" style="display:block;text-align:center;text-decoration:none;">Go to Community</a>
  <p class="auth-footer"><a href="{% url 'dashboard:index' %}">Back to Dashboard</a></p>
</div>
{% endblock %}
