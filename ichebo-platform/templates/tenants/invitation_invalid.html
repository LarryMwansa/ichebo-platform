{% extends "base_auth.html" %}
{% load static %}
{% block title %}Invitation Problem — Ichebo{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-card__brand">
    <img src="{% static 'images/logo.svg' %}" alt="Ichebo" class="auth-logo" style="height:56px;width:auto;">
  </div>
  <div style="text-align:center">
    <span class="material-symbols-outlined" style="font-size:2.5rem;color:var(--error)">error</span>
    <h1 style="font-size:1.4rem;margin:0.5rem 0 0.25rem">Can't Accept Invitation</h1>
    <p class="auth-card__subtitle">{{ reason }}</p>
  </div>
  <div class="auth-divider"></div>
  <a href="{% url 'dashboard:index' %}" class="auth-btn" style="display:block;text-align:center;text-decoration:none;">Go to Dashboard</a>
</div>
{% endblock %}
