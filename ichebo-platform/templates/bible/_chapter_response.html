{% include "bible/_chapter.html" %}

<span id="bible-topbar-version" hx-swap-oob="innerHTML">{{ translation.code }}</span>

<div id="bible-active-version" hx-swap-oob="innerHTML">
    <div style="font-family: var(--ff-display); font-size: 22px; font-weight: 800; color: var(--text);">{{ translation.code }}</div>
    <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">{{ translation.name }}</div>
</div>

<div id="bible-versions-list" hx-swap-oob="innerHTML">
    {% for trans in translations %}
    <button class="ctx-btn {% if trans.code == translation.code %}active{% endif %}"
            style="min-height: 40px; flex-shrink: 0;
                   {% if trans.code == translation.code %}background: var(--primary-light); color: var(--primary); border-color: var(--primary-alpha);{% endif %}"
            hx-post="{% url 'bible:htmx-set-translation' %}"
            hx-vals='js:{"translation_code": "{{ trans.code }}", "book_code": document.querySelector("#bible-chapter [data-book-code]")?.dataset.bookCode || "{{ book.code }}", "chapter": document.querySelector("#bible-chapter [data-book-code]")?.dataset.chapter || "{{ chapter }}"}'
            hx-target="#bible-chapter"
            hx-swap="innerHTML">
        <span class="material-symbols-outlined" style="font-size: 16px;">{% if trans.code == translation.code %}check{% else %}menu_book{% endif %}</span>
        <span style="font-weight: 700;">{{ trans.code }}</span>
        <span style="color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;">{{ trans.name }}</span>
    </button>
    {% endfor %}
</div>
