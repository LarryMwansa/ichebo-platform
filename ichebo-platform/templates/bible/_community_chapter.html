<!-- templates/bible/_community_chapter.html -->
<div class="bible-chapter-body" style="font-family: 'Playfair Display', Georgia, serif; font-size: 20px; line-height: 1.8; color: rgba(255,255,255,0.92); max-width: 720px; margin: 0 auto;">
  {% if verses %}
    <div style="margin-bottom: 2rem;">
      {% for verse in verses %}
        <div class="verse-node" id="v-{{ verse.verse }}" 
             data-book="{{ book.name }}" data-book-code="{{ book.code }}" data-chapter="{{ chapter }}" data-verse="{{ verse.verse }}" data-text="{{ verse.text }}"
             style="margin-bottom: 16px; position: relative; display: flex; align-items: baseline; gap: 10px; cursor: pointer; border-radius: 6px; padding: 4px 6px; margin-left: -6px; margin-right: -6px; transition: background 0.15s;">
          <span style="font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; color: var(--sc-primary); flex-shrink: 0; min-width: 24px; text-align: right; user-select: none; opacity: 0.85;">{{ verse.verse }}</span>
          <span class="verse-text">{{ verse.text }}</span>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div style="padding: 4rem 2rem; text-align: center; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px; font-family: 'Inter', sans-serif;">
      <div style="color: rgba(255,255,255,0.5); font-size: 15px;">Scripture text for this chapter is unavailable in the selected translation.</div>
    </div>
  {% endif %}
</div>
