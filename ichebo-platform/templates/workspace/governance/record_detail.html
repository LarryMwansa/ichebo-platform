{% extends "workspace/governance/base.html" %}
{% load static %}

{% block governance_content %}
<div style="max-width: 860px; margin: 0 auto; padding: 20px 0 100px;">
    {% include partial_tpl %}
</div>
{% endblock %}

{% block content %}
<div class="gov-shell">
  <div id="governance-content" class="gov-content">
    {% include partial_tpl %}
  </div>
</div>
{% endblock %}

{% block ws_options %}
    <div class="ws-options-section">
        <div class="ws-label-tag">Relationships</div>
        <div id="linked-records-area" hx-get="{% url 'governance:htmx-linked-records' record.id %}" hx-trigger="load">
            <div class="ws-empty-state" style="padding: var(--space-m); font-size: 12px;">Mapping connections...</div>
        </div>
    </div>
{% endblock %}
