# ⚠️  THIS FILE HAS DRIFTED FROM PRODUCTION.
#
# The live config is /etc/nginx/sites-available/ics on the VPS and is NOT a
# symlink to this file — changes here do not deploy. As of 2026-08-11 the live
# file carries three server blocks this copy does not:
#
#     handbook.ichebo.org, join.ichebo.org, identity.ichebo.org
#
# added when those subdomains shipped. Anyone copying this file over the live
# one would take all three offline. Treat the server's copy as authoritative
# until the two are reconciled; edits made here must also be applied there by
# hand (and vice versa).
#
# ============================================================
# ichebo.org — Marketing Site (static files)
# ============================================================
server {
    listen 80;
    server_name ichebo.org www.ichebo.org;

    location / {
        return 301 https://ichebo.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.ichebo.org;

    ssl_certificate /etc/letsencrypt/live/ichebo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ichebo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ichebo.org$request_uri;
}

server {
    listen 443 ssl;
    server_name ichebo.org;

    ssl_certificate /etc/letsencrypt/live/ichebo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ichebo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/scepter/ichebo-site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
# app.ichebo.org — Django Platform
# ============================================================
server {
    listen 80;
    server_name app.ichebo.org;

    location / {
        return 301 https://app.ichebo.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.ichebo.org;

    ssl_certificate /etc/letsencrypt/live/app.ichebo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ichebo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /static/ {
        alias /home/scepter/ichebo-platform-repo/ichebo-platform/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Lesson attachments are gated by learn.views.lesson_file, which checks
    # enrolment and unlock state before streaming. MinIO is proxied here
    # unauthenticated, so without this deny the Django check is decorative —
    # anyone with the object key could fetch the file directly.
    location ^~ /media/learn/protected/ {
        return 404;
    }

    location /media/ {
        proxy_pass http://localhost:9000/ics-media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}

